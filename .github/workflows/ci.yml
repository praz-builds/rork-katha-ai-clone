name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: expo/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: npx jest --passWithNoTests --ci --coverage

  backend:
    name: Edge Functions — Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `origin/main` exists as a ref for the migration
      # number check below. Fetching it in a later step instead would need
      # credentials this checkout deliberately does not keep.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # A hand-numbered migration that reuses a number already on main is
      # skipped silently in production: Supabase records applied migrations by
      # version string, so a second 00093 is "already applied" and never runs.
      # It passes every test, works on the developer's machine, and is missing
      # only where it matters. #115 and a branch in flight both took 00093 on
      # 2026-09-20; a human caught it. This is so a human does not have to.
      - name: Migration numbers do not collide with main
        run: scripts/check-migration-numbers.sh origin/main

      # Does this change touch SQL at all?
      #
      # The migration suite below spins up PGlite per test and takes ~8 of this
      # job's ~8.5 minutes. It ran on EVERY pull request, including the many
      # that only touch the Expo app -- about 200 runs in September, which is
      # how a 2,000-minute monthly allowance was spent by the 20th and stopped
      # CI for every agent at once.
      #
      # It is safe to skip when no `.sql` changed because these tests execute
      # the migration files against a real Postgres and assert on the schema
      # and policies they produce. Nothing in `expo/` or in the edge functions
      # can change that outcome; only a migration file can.
      #
      # Computed with git rather than a paths-filter action: the checkout above
      # already has full history, so this needs no third-party action in the
      # supply chain for something a one-line diff answers.
      - name: Does this change touch the database?
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            files="$(git diff --name-only "$base...HEAD")"
          else
            # A push to main. Compare against the commit before it; if that is
            # not available for any reason, fall through to running them.
            files="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo backend/supabase/migrations/force.sql)"
          fi
          if echo "$files" | grep -q '^backend/supabase/migrations/.*\.sql$'; then
            echo "sql=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Migration files changed -- running the migration suite"
          else
            echo "sql=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No migration files changed -- skipping the migration suite (~8 min)"
          fi

      # Every function, not a hand-maintained list: a new one is covered the
      # day it lands. feed/index.ts reached main with four TS2345 errors
      # because nothing here typechecked the Deno workspace at all.
      - name: Typecheck every edge function
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          for f in backend/supabase/functions/*/index.ts; do
            name=$(basename "$(dirname "$f")")
            if deno check "$f"; then
              echo "::notice::$name OK"
            else
              echo "::error::$name failed deno check"
              failed=1
            fi
          done
          exit "$failed"

      # Every function test, not just the shared modules.
      #
      # This ran `_shared/` alone, so each `functions/<name>/index.test.ts`
      # existed and never executed in CI. The publish visibility contract, the
      # engagement handlers and the narration entitlement gate all have handler
      # tests that were only ever run by hand.
      - name: Test edge functions
        run: deno test --allow-env --allow-net --allow-read backend/supabase/functions/

      # The migration tests, which had NEVER run in CI.
      #
      # They are the only automated proof of the security-critical SQL: that a
      # gated story cannot be made public even by a direct PostgREST write, that
      # a user cannot insert their own like row and desynchronise the counter,
      # that a private individual is never searchable, that one user cannot read
      # another's saved phrases. Every one of those was verified by a human
      # running deno locally and by nothing else.
      #
      # They spin up PGlite and take a few minutes. That is the right price for
      # the only thing standing between a bad migration and production.
      #
      # Gated on a migration file actually changing. See "Does this change
      # touch the database?" above for why that is safe, and what it cost not
      # to do it. A PR that touches SQL still runs every one of them.
      - name: Test migrations
        if: steps.changed.outputs.sql == 'true'
        run: deno test --allow-env --allow-net --allow-read backend/supabase/migrations/

      - name: Format check (shared LLM modules)
        run: deno fmt --check backend/supabase/functions/_shared/llm.ts backend/supabase/functions/_shared/llm.test.ts backend/supabase/functions/_shared/story_schema.ts

  # Runs only after something lands on main, because it is slow and its job is
  # to catch what the per-PR suites cannot: that the app actually bundles.
  #
  # `tsc` resolves imports through TypeScript's resolver and Metro does not, so
  # a path that typechecks can still fail to bundle -- and the symptom is a
  # blank screen with nothing useful in the log.
  smoke:
    name: Smoke - web bundle builds
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: expo/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: expo
        run: pnpm install --frozen-lockfile

      - name: Build the web bundle
        working-directory: expo
        run: pnpm exec expo export --platform web --output-dir "$RUNNER_TEMP/web-export"

      - name: Fail if the bundle produced nothing
        run: test -s "$RUNNER_TEMP/web-export/index.html"
