name: Claude Mention

# The conversational half: reply when someone writes @claude on an issue,
# a PR, or a review comment — asking a question, or asking for a fix.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Nothing by default. Only `respond` gets write scopes, and it starts only after
# `authorize` has said yes.
permissions: {}

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorise @claude
    runs-on: ubuntu-latest
    # THE GATE THAT AGENTS.md ALREADY CLAIMED WAS HERE.
    #
    # This workflow needs `ANTHROPIC_API_KEY`, and that secret does not
    # exist on this repository. Without it the action runs with an empty
    # key and fails, posting "Claude encountered an error" on every pull
    # request -- which is why both Claude workflows were switched off by
    # hand on 2026-09-25 and stayed off. Disabling a workflow is invisible
    # state: nothing in the repository says it happened, and AGENTS.md went
    # on calling Claude-as-reviewer a mandatory merge gate for four days.
    #
    # Gated instead. With the variable unset this job is skipped, which
    # reads as "skipped" on the pull request rather than as a failure, and
    # the workflow can stay ENABLED so its state is legible.
    #
    # WHO MAY ASK is decided by this job's one step, *Authorise the
    # requester*, not by this `if:` -- see that step for why. This `if:` only
    # decides whether the lookup runs at all. `respond`, the job with write
    # scopes, needs this one and starts only on its yes.
    # (`claude-review.yml` has no author check. It is the lower-risk one
    # because it cannot push -- `contents: read` -- and because it fires on
    # `pull_request`, not on anything a commenter can send. It still holds
    # `pull-requests: write` and `issues: write`; it is not safe, it is
    # smaller.)
    #
    # `@claude` MUST OPEN THE TEXT, not merely appear in it. The standing
    # review routine posts as the repository owner -- an admin, who passes
    # the author check -- and its reviews quote and discuss `@claude` by
    # name. With `contains`, the first review that mentions this workflow
    # would have invoked it with push rights. An invocation is a message
    # that starts with `@claude`; a discussion of one is not.
    #
    # THE PARENTHESES AROUND THE DISJUNCTION ARE LOAD-BEARING. `&&` binds
    # tighter than `||`, so writing the gate as a bare first clause parses as
    # `(GATE && issue_comment) || review_comment || review || issues` -- it
    # gates ONE of the four paths this workflow subscribes to and leaves the
    # other three running with an empty key, which is the failure the gate
    # exists to stop. `claude-review.yml` can prefix its gate without brackets
    # because all of its clauses are `&&`; this one cannot.
    if: >-
      vars.CLAUDE_ACTION_ENABLED == 'true' && (
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && startsWith(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (startsWith(github.event.issue.body, '@claude') || startsWith(github.event.issue.title, '@claude')))
      )
    # A job with no scopes at all: the permission lookup needs only Metadata
    # read, which every token carries. Verified on GitHub on 2026-10-01 with
    # `permissions: {}` (owner -> admin, a stranger -> read). So a stranger's
    # @claude starts this job and nothing else -- no write scopes, no
    # id-token, no checkout.
    permissions: {}
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      # THE AUTHOR GATE. Both people behind this run must be able to push:
      #   - the WRITER of the @claude text, read per event, because each
      #     trigger carries it in a different place (comment / review /
      #     issue); and
      #   - the SENDER, who caused this event. On `issues: [assigned]` that
      #     is the assigner, not the author, so checking only the writer
      #     would let anyone's issue run once a maintainer assigns it, and
      #     checking only the sender would gate the wrong person.
      # `github.event.sender` is fixed in the payload, so a Re-run checks
      # the same two people. The re-runner already needed write access to
      # press the button.
      #
      # Resolved through the API, not through `author_association`: on a
      # public repository COLLABORATOR says nothing about the level, and
      # the payload has no association for the sender at all. Only admin,
      # maintain and write pass. Bots answer `none`, a stranger on this
      # public repo answers `read`, an unknown login 404s to `none`, and any
      # other API failure fails the job red, which is still closed. (This
      # field reports maintain as `write` and triage as `read`; `maintain` is
      # listed below only so the intent reads plainly.)
      # Logins reach the script through `env`, never interpolated into it.
      - name: Authorise the requester
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER: ${{ github.event.comment.user.login || github.event.review.user.login || github.event.issue.user.login }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -uo pipefail
          allowed=true
          for login in "${WRITER:-}" "${SENDER:-}"; do
            if [ -z "$login" ]; then
              # An event shape nobody predicted; the one denial worth seeing.
              echo "::warning::Could not tell who wrote this @claude (empty login); skipping."
              allowed=false; break
            fi
            # A refusal and a broken lookup must not look alike. A 404 (no
            # such user) is a plain refusal; any other failure is the gate
            # itself breaking, so the job goes RED -- still closed, since
            # `respond` needs a yes -- instead of a green that reads as "denied".
            if ! out=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" \
                         --jq .permission 2>&1); then
              if printf '%s' "$out" | grep -q "HTTP 404"; then
                perm=none
              else
                echo "::error::Permission lookup failed for $login: $out"
                exit 1
              fi
            else
              perm=$out
            fi
            case "$perm" in
              admin|maintain|write) echo "$login: $perm" ;;
              *) echo "::warning::$login ($perm) may not invoke @claude; skipping."; allowed=false ;;
            esac
          done
          echo "allowed=${allowed}" >> "$GITHUB_OUTPUT"

  respond:
    name: Respond to @claude
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      # An issue_comment payload carries no head ref, so a bare checkout lands
      # on the default branch: asking @claude to fix something on a pull
      # request would read main and push to the wrong place. Resolve the real
      # head branch -- but only when checking it out is both possible and safe.
      #
      # Left empty (the default branch) when:
      #   - the comment is on a plain issue, which has no branch;
      #   - the pull request is closed or merged, because the branch is deleted
      #     after merge and checkout would fail on a ref that no longer exists;
      #   - the pull request came from a fork, because headRefName is a bare
      #     branch name that checkout resolves against THIS repository, so a
      #     fork PR from its own main would check out our main -- and the job
      #     holds contents: write and reads AGENTS.md from whatever it checks
      #     out.
      - name: Resolve the branch to check out
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ref=""
          if [ -n "${PR_NUMBER:-}" ]; then
            # A transient API error must fall back to the default branch, not
            # fail the step: the comment still deserves an answer.
            pr=$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
                   --json state,headRefName,headRepository || echo '')
            if [ -n "$pr" ]; then
              state=$(printf '%s' "$pr" | jq -r '.state')
              # Compare the full nameWithOwner, the same test claude-review.yml
              # makes, not just the owner.
              head_repo=$(printf '%s' "$pr" | jq -r '.headRepository.nameWithOwner // ""')
              if [ "$state" = "OPEN" ] && [ "$head_repo" = "${GITHUB_REPOSITORY}" ]; then
                ref=$(printf '%s' "$pr" | jq -r '.headRefName')
              fi
            fi
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Empty means the default branch, which is the safe fallback for a
          # plain issue, a merged pull request, and a fork.
          ref: ${{ steps.target.outputs.ref }}

      - uses: anthropics/claude-code-action@d9fa72aedd427e79c6dcec0388f2656619eb3c6a # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
            --max-turns 60
          prompt: |
            Read AGENTS.md before doing anything — it is the canonical
            repository contract and it routes you to the right workspace guide
            and skill.

            The branch checked out for you is "${{ steps.target.outputs.ref }}".
            When that is empty you are on the default branch, which means this
            is a plain issue, a merged pull request, a fork, or a failed
            lookup. In that case answer only: never commit and never push,
            whatever the request asks for, and say which you are doing.

            Otherwise answer the @claude request in this thread. If it asks for
            a change, make it on that branch and push, then say in one short
            comment what changed in user-flow terms. If it asks a question,
            answer it and change nothing.
