name: Claude Mention

# The conversational half: reply when someone writes @claude on an issue,
# a PR, or a review comment — asking a question, or asking for a fix.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    name: Respond to @claude
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    steps:
      # On an issue_comment event the payload carries no head ref, so a bare
      # checkout lands on the default branch. Asking @claude to fix something
      # on a pull request would then read main and push to the wrong place.
      # Resolve the pull request's real head branch first.
      - name: Resolve the branch to check out
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ -n "${PR_NUMBER}" ]; then
            ref=$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefName --jq .headRefName)
            echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Empty means the default branch, which is right for a plain issue.
          ref: ${{ steps.target.outputs.ref }}

      - uses: anthropics/claude-code-action@d9fa72aedd427e79c6dcec0388f2656619eb3c6a # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
            --max-turns 60
          prompt: |
            Read AGENTS.md before doing anything — it is the canonical
            repository contract and it routes you to the right workspace guide
            and skill.

            Answer the @claude request in this thread. If it asks for a change,
            make it on this PR's branch and push, then say in one short comment
            what changed in user-flow terms. If it asks a question, answer it
            and change nothing.
