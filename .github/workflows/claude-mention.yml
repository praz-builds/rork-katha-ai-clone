name: Claude Mention

# The conversational half: reply when someone writes @claude on an issue,
# a PR, or a review comment — asking a question, or asking for a fix.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    name: Respond to @claude
    runs-on: ubuntu-latest
    # THE GATE THAT AGENTS.md ALREADY CLAIMED WAS HERE.
    #
    # This workflow needs `ANTHROPIC_API_KEY`, and that secret does not
    # exist on this repository. Without it the action runs with an empty
    # key and fails, posting "Claude encountered an error" on every pull
    # request -- which is why both Claude workflows were switched off by
    # hand on 2026-09-25 and stayed off. Disabling a workflow is invisible
    # state: nothing in the repository says it happened, and AGENTS.md went
    # on calling Claude-as-reviewer a mandatory merge gate for four days.
    #
    # Gated instead. With the variable unset this job is skipped, which
    # reads as "skipped" on the pull request rather than as a failure, and
    # the workflow can stay ENABLED so its state is legible. Set the secret
    # and `gh variable set CLAUDE_ACTION_ENABLED --body true` to turn it on;
    # no workflow edit is needed.
    if: >-
      vars.CLAUDE_ACTION_ENABLED == 'true' &&
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@d9fa72aedd427e79c6dcec0388f2656619eb3c6a # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
            --max-turns 60
          prompt: |
            Read AGENTS.md before doing anything — it is the canonical
            repository contract and it routes you to the right workspace guide
            and skill.

            Answer the @claude request in this thread. If it asks for a change,
            make it on this PR's branch and push, then say in one short comment
            what changed in user-flow terms. If it asks a question, answer it
            and change nothing.
