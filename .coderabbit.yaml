# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: assertive
  high_level_summary: true
  request_changes_workflow: true
  review_status: true
  fail_commit_status: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    base_branches:
      - main
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.expo/**"
    - "!**/.gradle/**"
    - "!**/Pods/**"
    - "!**/DerivedData/**"
    - "!**/pnpm-lock.yaml"
    - "!expo/assets/**"
    - "!.agents/**"
  path_instructions:
    - path: "expo/**"
      instructions: |
        Review as an Expo SDK 54 and React Native application targeting iOS, Android, and web.
        Prioritize behavioral regressions, navigation/state correctness, accessibility, responsive 390x844 layouts, animation cleanup, performance, and consistency with expo/DESIGN.md.
        Flag native-only or web-only assumptions and require focused validation for user-facing flow changes.
    - path: "backend/**"
      instructions: |
        Review Supabase migrations and Edge Functions with a security-first posture.
        Prioritize authentication and authorization, RLS coverage, service-role exposure, input validation, atomic credit accounting, webhook verification and idempotency, retries, secret handling, and backward-compatible schema changes.
        Require explicit failure handling for external AI, storage, Adapty, and notification integrations.
    - path: "ios-katha-ai-create-stories/**"
      instructions: |
        Review Swift and SwiftUI changes for lifecycle correctness, accessibility, state ownership, concurrency safety, memory management, and compatibility with the active Expo product contract.
    - path: "android-katha-ai/**"
      instructions: |
        Review Kotlin and Jetpack Compose changes for lifecycle correctness, accessibility, state ownership, coroutine safety, recomposition behavior, and compatibility with the active Expo product contract.
    - path: "**/*.md"
      instructions: |
        Check that documentation matches the current monorepo structure, shipped behavior, commands, and integration status. Flag stale references to separate Katha repositories or removed handoff files.

chat:
  art: false
