    const paths={home:'<path d="m3 10 9-7 9 7"/><path d="M5 9.5V20h14V9.5"/><path d="M9 20v-6h6v6"/>',compass:'<circle cx="12" cy="12" r="8.5"/><path d="m14.8 9.2-2 3.6-3.6 2 2-3.6 3.6-2Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/><path d="M4 19V5.5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.42 1.42-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.42-1.42.06-.06A1.7 1.7 0 0 0 9.4 15a1.7 1.7 0 0 0-1.56-1.03H7v-2h.84A1.7 1.7 0 0 0 9.4 11a1.7 1.7 0 0 0-.34-1.88L9 9.06l1.42-1.42.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 13.4 6.5V6h2v.5a1.7 1.7 0 0 0 1.03 1.54 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.42 1.42-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03H21v2h-.06A1.7 1.7 0 0 0 19.4 15Z"/>',bell:'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',search:'<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/>',bookmark:'<path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5Z"/>',heart:'<path d="M20.8 8.8c0 5.2-8.8 10-8.8 10s-8.8-4.8-8.8-10A4.8 4.8 0 0 1 12 6.3a4.8 4.8 0 0 1 8.8 2.5Z"/>',sparkles:'<path d="m12 3 1.2 4.8L18 9l-4.8 1.2L12 15l-1.2-4.8L6 9l4.8-1.2L12 3Z"/><path d="m19 15 .6 2.4L22 18l-2.4.6L19 21l-.6-2.4L16 18l2.4-.6L19 15Z"/>',chevron:'<path d="m9 18 6-6-6-6"/>',arrow:'<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',wand:'<path d="m15 4 5 5"/><path d="m13 6 5 5-9 9H4v-5l9-9Z"/><path d="M5 3v3M3 5h4"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',more:'<circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/>'};
    const icon=(name,size=18)=>`<svg aria-hidden="true" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.sparkles}</svg>`;
    const avatar=(initials,tone='',size='md')=>`<div class="avatar avatar-${tone} avatar-${size}">${initials}</div>`;
    const cover=(story,compact=false)=>`<div class="cover ${story.cover} ${compact?'cover-compact':''}"><span>${story.genre}</span><strong>${story.title.split(' ').slice(0,2).join(' ')}</strong><i></i></div>`;
    function storyCard(story,horizontal=false){return `<article class="story-card ${horizontal?'story-card-horizontal':''}">${cover(story,horizontal)}<div class="story-card-copy"><div class="story-card-topline"><span class="eyebrow">${story.tag}</span><button class="icon-button ${favorites.has(story.id)?'is-favorite':''}" data-action="favorite" data-id="${story.id}">${icon('bookmark',17)}</button></div><h3>${story.title}</h3><p class="story-author">${story.author} <span>·</span> ${story.genre}</p><p class="story-description">${story.description}</p><div class="engagement"><span>${icon('heart',14)} ${story.likes}</span><span>${story.reads} reads</span>${story.progress?`<span class="progress-copy">${story.progress}% read</span>`:''}</div>${story.progress?`<div class="progress-track"><span style="width:${story.progress}%"></span></div>`:''}</div></article>`}
    function header(label,title,right=''){return `<header class="screen-header"><div><span class="micro-label">${label}</span><h1>${title}</h1></div>${right||''}</header>`}
    function home(){return `<div class="screen screen-home">${header('Tuesday, August 18','Good morning, <em>Riya</em>',`<div class="header-actions"><button class="header-icon">${icon('bell')}</button><button class="sign-in-button" data-tab="settings">Sign in</button></div>`)}<div class="prototype-note">${icon('sparkles',14)}<span>Visual critique prototype · local sample data</span></div><section class="continue-card" data-action="reader"><div class="continue-art"><span>CONTINUE</span><strong>The Last<br>Lighthouse<br>Keeper</strong><div class="wave-line"></div></div><div class="continue-copy"><span class="micro-label">Pick up where you left off</span><h2>The Last Lighthouse Keeper</h2><p>Chapter 2 · The light between storms</p><div class="continue-progress"><span style="width:40%"></span></div><span class="continue-meta">40% complete <b>→</b></span></div></section><section><div class="section-header"><h2>A story for your mood</h2><button class="text-link">Refresh</button></div><div class="featured-card"><div class="featured-content"><span class="eyebrow eyebrow-light">EDITOR'S PICK</span><h2>Midnight in Marrakech</h2><p>A blue door appears only for people with a secret.</p><div class="featured-by">${avatar('ZO','rose','sm')}<span>Zoe Okafor <small>· Mystery</small></span></div><button class="light-button" data-action="reader">Start reading ${icon('arrow',14)}</button></div><div class="featured-orbit orbit-one"></div><div class="featured-orbit orbit-two"></div><div class="featured-lantern">✦</div></div></section><section><div class="section-header"><h2>Trending on Katha</h2><button class="text-link">See all ${icon('chevron',13)}</button></div><div class="horizontal-scroll">${stories.slice(1,4).map(s=>storyCard(s,true)).join('')}</div></section><section class="writers-section"><div class="section-header"><h2>Writers to follow</h2><button class="text-link">Discover writers</button></div><div class="writer-row"><div class="writer">${avatar('AM')}<strong>Aarav Mehta</strong><span>48.2k followers</span><button>Follow</button></div><div class="writer">${avatar('MK','green')}<strong>Maya Kapoor</strong><span>3.4k followers</span><button>Follow</button></div><div class="writer">${avatar('RT','blue')}<strong>Ren Takahashi</strong><span>1.2k followers</span><button>Follow</button></div></div></section></div>`}
    function discover(){const filtered=genre==='All stories'?stories:stories.filter(s=>s.genre===genre);return `<div class="screen">${header('Find your next world','Discover',`<button class="header-icon">${icon('search')}</button>`)}<div class="discover-chips">${['For you','Trending','Rising','New'].map(c=>`<button class="filter-chip ${rank===c?'selected':''}" data-rank="${c}">${c}</button>`).join('')}</div><div class="genre-chips">${['All stories','Adventure','Fantasy','Romance','Mystery','Sci-Fi','Drama'].map(c=>`<button class="genre-chip ${genre===c?'selected':''}" data-genre="${c}">${c}</button>`).join('')}</div><div class="safe-note">${icon('lock',15)}<span>Thoughtful stories, age-safe by default</span>${icon('chevron',14)}</div><section><div class="feed-header"><span>${rank} · ${genre}</span><button class="icon-button">${icon('settings',16)}</button></div><div class="discover-feed">${filtered.map(s=>storyCard(s)).join('')}</div></section></div>`}
    function create(){return `<div class="screen create-screen">${header('Turn a spark into a story','Create',`<div class="credit-pill">${icon('sparkles',14)} 12 credits</div>`)}<div class="create-hero"><div class="wand-mark">${icon('wand',24)}</div><h2>What story is waiting<br>inside you?</h2><p>Katha helps you shape the idea. You decide where it goes.</p></div><label class="field-label" for="story-prompt">Your story seed</label><textarea id="story-prompt" placeholder="A lighthouse keeper discovers a letter from the future..." rows="4"></textarea><div class="prompt-suggestions"><button data-prompt="A chef who can taste people's memories">Memory chef</button><button data-prompt="Two strangers meet on a train that never stops">Midnight train</button></div><span class="field-label">Genre</span><div class="select-chips">${['Fantasy','Mystery','Romance','Sci-Fi'].map((c,i)=>`<button class="select-chip ${i===0?'selected':''}">${c}</button>`).join('')}</div><div class="select-row"><button><span><span class="field-label">Language</span><strong>English</strong></span>${icon('chevron',16)}</button><button><span><span class="field-label">Reading level</span><strong>Teen</strong></span>${icon('chevron',16)}</button></div><div class="character-preview"><div class="character-icon">✦</div><div><strong>Build your cast</strong><span>Add characters after your first draft</span></div>${icon('chevron',17)}</div><button class="primary-button" id="create-button" disabled>${icon('wand',17)} Create my story</button><p class="credit-footnote">Uses 1 credit · You can edit every detail</p></div>`}
    function library(){const visible=libraryTab==='Saved'?[stories[1],stories[3]]:libraryTab==='History'?[stories[0],stories[2]]:libraryTab==='My stories'?[stories[0]]:[];return `<div class="screen">${header('Your reading room','Library',`<button class="header-icon">${icon('search')}</button>`)}<div class="segment-control">${['Saved','History','Downloads','My stories'].map(c=>`<button class="${libraryTab===c?'selected':''}" data-library="${c}">${c}</button>`).join('')}</div>${libraryTab==='Downloads'?`<div class="empty-library"><div class="empty-icon">${icon('book',25)}</div><h2>Stories for the road</h2><p>Downloaded stories will live here for offline reading.</p><button class="secondary-button" data-tab="discover">Find a story</button></div>`:`<section class="library-list">${visible.map(s=>`<article class="library-row" data-action="reader">${cover(s,true)}<div><span class="eyebrow">${libraryTab==='My stories'?'YOUR DRAFT':s.tag}</span><h3>${s.title}</h3><p>${s.author} · ${s.genre}</p><div class="row-meta">${s.progress?`<span>${s.progress}% read</span><div class="progress-track"><span style="width:${s.progress}%"></span></div>`:`<span>${s.reads} reads</span>`}${icon('chevron',15)}</div></div></article>`).join('')}</section>`}</div>`}
    function settings(){return `<div class="screen settings-screen">${header('Make Katha yours','Settings',`<button class="header-icon">${icon('more')}</button>`)}<section class="profile-card">${avatar('RS','amber','lg')}<div><h2>Riya Sharma</h2><p>@riya.reads</p></div><button class="icon-button">${icon('chevron',16)}</button></section><button class="premium-card"><div class="premium-icon">${icon('sparkles',19)}</div><span><strong>Unlock your full reading life</strong><small>Unlimited stories · premium voices · no ads</small></span><b>→</b></button><button class="credits-row"><span><span class="credits-symbol">✦</span><span><strong>12 credits</strong><small>Enough for 12 story ideas</small></span></span><span class="text-link">Get more</span></button>${[['Reading',[['Aa','Font size','18 pt'],['◐','Reading level','Teen'],['◷','Audiobook voice','Katha voice']]],['App',[['⌘','Notifications','On'],['◐','App theme',dark?'Dark':'Light'],['▣','Language','English']]],['Support',[['★','Rate Katha',''],['?','FAQ','']]]].map(([title,rows])=>`<section class="settings-group"><h2>${title}</h2><div class="settings-card">${rows.map(([i,l,v])=>`<button class="settings-row" data-setting="${l}"><span class="setting-icon">${i}</span><strong>${l}</strong>${v?`<span class="setting-value">${v}</span>`:''}${icon('chevron',15)}</button>`).join('')}</div></section>`).join('')}<button class="signout-link">Sign out</button><p class="settings-footer">Katha AI · Create stories that stay with you<br>Visual prototype for critique only</p></div>`}
    function readerView(){return `<div class="reader-overlay"><div class="reader-top"><button class="header-icon" data-action="close">${icon('close')}</button><span>THE LAST LIGHTHOUSE KEEPER</span><button class="header-icon">${icon('more')}</button></div><div class="reader-page"><span class="reader-chapter">CHAPTER TWO</span><h1>The light between storms</h1><p class="drop-cap">T</p><p>he sea had a way of making every promise sound larger than it was. From the top room of the lighthouse, Aarav watched the horizon gather itself into a dark blue line.</p><p>He had kept the lamp for eleven years. Tonight, for the first time, a second light answered from beyond the reef.</p><div class="reader-rule"></div><span class="reader-note">A quiet, atmospheric preview of the native reading experience.</span></div><div class="reader-bottom"><div class="reader-progress"><span style="width:40%"></span></div><div><span>40% complete</span><button class="reader-heart">${icon('heart',20)}</button></div></div></div>`}
    function render(){document.body.classList.toggle('theme-dark',dark);document.getElementById('app').innerHTML=`<div class="presentation-bar"><span><b>KATHA</b> visual critique</span><span>Tap through · annotate · compare</span></div><main class="phone-shell" aria-label="Katha visual critique prototype"><div class="status-bar"><span>9:41</span><span class="status-right">▮▮▮　⌁　▰</span></div><div class="phone-content">${tab==='home'?home():tab==='discover'?discover():tab==='create'?create():tab==='library'?library():settings()}</div><nav class="bottom-nav">${tabs.map(([id,label,name])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${id==='create'?`<span class="create-tab-icon">${icon('plus',22)}</span>`:icon(name,19)}<span>${label}</span></button>`).join('')}</nav>${reader?readerView():''}</main><p class="critique-help">Local-only artifact · no app data or services are connected</p>`;bind()}
    function showToast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
    function bind(){document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.tab;render()}));document.querySelectorAll('[data-action="reader"]').forEach(el=>el.addEventListener('click',()=>{reader=true;render()}));document.querySelectorAll('[data-action="close"]').forEach(el=>el.addEventListener('click',()=>{reader=false;render()}));document.querySelectorAll('[data-action="favorite"]').forEach(el=>el.addEventListener('click',event=>{event.stopPropagation();const id=el.dataset.id;favorites.has(id)?favorites.delete(id):favorites.add(id);render();showToast(favorites.has(id)?'Saved to Library':'Removed from Library')}));document.querySelectorAll('[data-rank]').forEach(el=>el.addEventListener('click',()=>{rank=el.dataset.rank;render()}));document.querySelectorAll('[data-genre]').forEach(el=>el.addEventListener('click',()=>{genre=el.dataset.genre;render()}));document.querySelectorAll('[data-library]').forEach(el=>el.addEventListener('click',()=>{libraryTab=el.dataset.library;render()}));document.querySelectorAll('[data-prompt]').forEach(el=>el.addEventListener('click',()=>{const textarea=document.getElementById('story-prompt');textarea.value=el.dataset.prompt;document.getElementById('create-button').disabled=false}));const textarea=document.getElementById('story-prompt');if(textarea){textarea.addEventListener('input',()=>{document.getElementById('create-button').disabled=!textarea.value.trim()});document.getElementById('create-button').addEventListener('click',()=>{showToast('Draft ready to shape');document.getElementById('create-button').innerHTML=icon('check',17)+' Draft ready to shape'})}document.querySelectorAll('.select-chip').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.select-chip').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}));document.querySelectorAll('[data-setting="App theme"]').forEach(el=>el.addEventListener('click',()=>{dark=!dark;render()}));}
    render();
  </script>
