# Which dependencies may run install scripts.
#
# pnpm stopped running dependency build scripts unless they are named here, and
# it exits non-zero when it has skipped any, so `pnpm install --frozen-lockfile`
# fails in CI until every one of them is answered. `pnpm approve-builds` writes
# this block for you but leaves the literal string "set this to true or false"
# as each value, which is not a boolean and approves nothing, so the exit code
# survives. That stub was sitting in this file and is why CI failed at install.
#
# All four are build-time only: native bindings and postinstall codegen. None of
# them ships code into the app bundle.
allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  protobufjs: true
  unrs-resolver: true
overrides:
  "@expo/plist>@xmldom/xmldom": 0.8.15
  "plist>@xmldom/xmldom": 0.9.12
  "@expo/metro-config>postcss": 8.5.23
  "xcode>uuid": 11.1.1
  uuid: 11.1.1
patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch
auditConfig:
  # Locally patched because the advisory's patched 2.0.3 release is not
  # published on npm yet. Keep both ignores tied to the patch above.
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
