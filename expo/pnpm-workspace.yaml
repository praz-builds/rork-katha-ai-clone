# Which dependencies may run install scripts.
#
# pnpm stopped running dependency build scripts unless they are named here, and
# it exits non-zero when it has skipped any, so `pnpm install --frozen-lockfile`
# fails in CI until every one of them is answered. `pnpm approve-builds` writes
# this block for you but leaves the literal string "set this to true or false"
# as each value, which is not a boolean and approves nothing, so the exit code
# survives. That stub was sitting in this file and is why CI failed at install.
#
# All four are build-time only: native bindings and postinstall codegen. None of
# them ships code into the app bundle.
allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  protobufjs: true
  unrs-resolver: true
overrides:
  "@expo/plist>@xmldom/xmldom": 0.8.15
  "plist>@xmldom/xmldom": 0.9.12
  "@expo/metro-config>postcss": 8.5.23
  "xcode>uuid": 11.1.1
  uuid: 11.1.1
  # GHSA-2883-xcg3-v3hh: `maxTotalMergeKeys` does not bound CPU when a merge
  # source is empty, so a crafted YAML can hang the parser. Both ranges are
  # build-time only -- @expo/cli>@expo/xcpretty and babel-jest's nyc config
  # loader -- and neither ships into the app bundle, but both have a fixed
  # release, so they are bumped rather than ignored.
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
# CVE-2025-71329 (JXL) and CVE-2025-71330 (ICNS): image-size 1.2.1 loops forever
# on a crafted file whose box header declares a zero length, because the parser
# advances its cursor by that length. metro pins image-size to ^1.0.2 and there
# is no fixed release to move to -- GitHub records no patched version for either
# CVE, and 2.0.2, the latest, is still vulnerable -- so both loops are patched
# in place. image-size is build-time only (metro reads asset dimensions during
# bundling) and ships nothing into the app.
patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch
auditConfig:
  # Both advisories stay ignored only for as long as the patch above is in
  # place; expo/src/__tests__/image-size-patch.test.ts fails if it is dropped.
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
