<!doctype html>
<!--
  Google Play app icon, 512 x 512.

  The source is expo/assets/icon.png (1024 x 1024), the same file app.json
  ships as the launcher icon, so the store icon and the installed icon cannot
  drift apart. Play wants a full-bleed square and applies its own corner mask,
  so nothing is rounded or padded here. Rendered by render.mjs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Katha icon 512</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
  img { display: block; width: 512px; height: 512px; }
</style>
</head>
<body>
  <img src="../../../expo/assets/icon.png" alt="Katha AI">
</body>
</html>
